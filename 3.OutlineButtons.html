<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>
     <!-- Center the buttons on the page -->
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div>
      <!-- Outline Primary button -->
      <button type="button" class="btn btn-outline-primary mb-2">Primary</button><br>

      <!-- Outline Secondary button -->
      <button type="button" class="btn btn-outline-secondary mb-2">Secondary</button><br>

      <!-- Outline Success button -->
      <button type="button" class="btn btn-outline-success mb-2">Success</button><br>

      <!-- Outline Danger button -->
      <button type="button" class="btn btn-outline-danger mb-2">Danger</button><br>

      <!-- Outline Warning button -->
      <button type="button" class="btn btn-outline-warning mb-2">Warning</button><br>

      <!-- Outline Info button -->
      <button type="button" class="btn btn-outline-info mb-2">Info</button><br>

      <!-- Outline Light button -->
      <button type="button" class="btn btn-outline-light text-dark mb-2">Light</button><br>
      <!-- Note: 'text-dark' makes the text visible on light background -->

      <!-- Outline Dark button -->
      <button type="button" class="btn btn-outline-dark mb-2">Dark</button><br>
    </div>
  </div>












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
