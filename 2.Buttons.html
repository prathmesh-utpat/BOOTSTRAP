<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <h1>Buttons and types </h1>
 <!-- Container to center vertically and horizontally -->
  <div class="d-flex justify-content-center align-items-center vh-100">
    <!-- Inner div for buttons -->
    <div>
      <button type="button" class="btn btn-primary mb-2">Primary</button><br>
      <button type="button" class="btn btn-secondary mb-2">Secondary</button><br>
      <button type="button" class="btn btn-success mb-2">Success</button><br>
      <button type="button" class="btn btn-danger mb-2">Danger</button><br>
      <button type="button" class="btn btn-warning mb-2">Warning</button><br>
      <button type="button" class="btn btn-info mb-2">Info</button><br>
      <button type="button" class="btn btn-light mb-2">Light</button><br>
      <button type="button" class="btn btn-dark mb-2">Dark</button><br>
    </div>
  </div>

 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
