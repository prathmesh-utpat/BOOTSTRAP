<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Badges</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <h2>Bootstrap Badges</h2>

  <!-- Basic badge -->
  <p>Example: <span class="badge bg-primary">New</span> <!-- Simple badge with primary color --></p>

  <!-- All contextual color badges -->
  <p>
    <span class="badge bg-primary">Primary</span>     <!-- Blue badge -->
    <span class="badge bg-secondary">Secondary</span> <!-- Gray badge -->
    <span class="badge bg-success">Success</span>     <!-- Green badge -->
    <span class="badge bg-danger">Danger</span>       <!-- Red badge -->
    <span class="badge bg-warning text-dark">Warning</span> <!-- Yellow with dark text -->
    <span class="badge bg-info text-dark">Info</span>       <!-- Light blue -->
    <span class="badge bg-light text-dark">Light</span>     <!-- White/light badge -->
    <span class="badge bg-dark">Dark</span>           <!-- Black badge -->
  </p>

  <!-- Pill Badges (rounded corners) -->
  <p>
    <span class="badge rounded-pill bg-primary">Primary</span> <!-- Rounded pill shape -->
    <span class="badge rounded-pill bg-danger">Alert</span>    <!-- Rounded pill with red -->
  </p>

  <!-- Badge in a button (commonly used for notifications) -->
  <button type="button" class="btn btn-primary">
    Notifications <span class="badge bg-light text-dark">4</span>
  </button>

  <br><br>

  <!-- Badge with anchor (like a clickable badge) -->
  <a href="#" class="badge bg-success text-decoration-none">Click Me</a>

</div>

</body>
</html>
