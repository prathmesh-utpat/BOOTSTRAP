<!DOCTYPE html>
<html lang="en">
<head>
  <title>Badge Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .top-right-badge {
      position: absolute;
      top: 0;
      right: 0;
      transform: translate(50%, -50%);
    }
  </style>
</head>
<body>

<div class="container py-5">

  <!-- Badge inside button -->
  <button class="btn btn-primary">
    Messages <span class="badge bg-light text-dark">4</span>
  </button>

  <br><br>

  <!-- Pill-shaped badge -->
  <span class="badge rounded-pill bg-success">New</span>

  <br><br>

  <!-- Top-right positioned badge on button -->
  <div class="position-relative d-inline-block">
    <button class="btn btn-secondary">Inbox</button>
    <span class="badge bg-danger rounded-pill top-right-badge">3</span>
  </div>

</div>

</body>
</html>
