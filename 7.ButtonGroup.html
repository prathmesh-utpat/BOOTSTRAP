<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Button Groups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- 🔹 Horizontal Button Group -->
  <h5>Horizontal Button Group</h5>
  <div class="btn-group">
    <button type="button" class="btn btn-primary">HOME</button>
    <button type="button" class="btn btn-primary">VIDEOS</button>
    <button type="button" class="btn btn-primary">SHORTS</button>
  </div>

  <br><br>

  <!-- 🔹 Outline Buttons -->
  <h5>Outline Buttons</h5>
  <div class="btn-group">
    <button type="button" class="btn btn-outline-success">LIKE</button>
    <button type="button" class="btn btn-outline-danger">DISLIKE</button>
    <button type="button" class="btn btn-outline-warning">SHARE</button>
  </div>

  <br><br>

  <!-- 🔹 Vertical Button Group -->
  <h5>Vertical Button Group</h5>
  <div class="btn-group-vertical">
    <button type="button" class="btn btn-info">PROFILE</button>
    <button type="button" class="btn btn-info">CHANNEL</button>
    <button type="button" class="btn btn-info">LOGOUT</button>
  </div>

  <br><br>

  <!-- 🔹 Mixed Size Buttons -->
  <h5>Small Button Group</h5>
  <div class="btn-group btn-group-sm">
    <button type="button" class="btn btn-dark">Small 1</button>
    <button type="button" class="btn btn-dark">Small 2</button>
  </div>

  <br><br>

  <h5>Large Button Group</h5>
  <div class="btn-group btn-group-lg">
    <button type="button" class="btn btn-secondary">Large 1</button>
    <button type="button" class="btn btn-secondary">Large 2</button>
  </div>

</body>
</html>
