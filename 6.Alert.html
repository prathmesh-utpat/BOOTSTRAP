<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-4">

    <h1>Bootstrap Alerts</h1>

    <!-- 🔴 Danger Alert -->
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      This is a Danger Alert! <!-- Used for error or delete warnings -->
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 🔵 Primary Alert -->
    <div class="alert alert-primary" role="alert">
      This is a Primary Alert! <!-- Used for main highlights or info -->
    </div>

    <!-- ⚪ Secondary Alert -->
    <div class="alert alert-secondary" role="alert">
      This is a Secondary Alert! <!-- Less important info -->
    </div>

    <!-- ✅ Success Alert -->
    <div class="alert alert-success" role="alert">
      This is a Success Alert! <!-- Used after successful action -->
    </div>

    <!-- ⚠️ Warning Alert -->
    <div class="alert alert-warning" role="alert">
      This is a Warning Alert! <!-- Used for cautionary messages -->
    </div>

    <!-- 🔵 Info Alert -->
    <div class="alert alert-info" role="alert">
      This is an Info Alert! <!-- For general information -->
    </div>

    <!-- ⚫ Dark Alert -->
    <div class="alert alert-dark" role="alert">
      This is a Dark Alert! <!-- For strong or muted emphasis -->
    </div>

    <!-- ⚪ Light Alert -->
    <div class="alert alert-light" role="alert">
      This is a Light Alert! <!-- Subtle messages, low contrast -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
