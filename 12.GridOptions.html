<!DOCTYPE html>
<html lang="en">
<head>
  <title>Grid Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">

  <div class="container">
    <div class="row">
      <!-- opctions like - small, extra small , large , medium , extra large - grid changer according to screen size -->
      <!-- 👇 Full width on XS (<576px), half on SM (≥576px), 1/3 on MD, 1/4 on LG, 1/6 on XL, 1/12 on XXL -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1 bg-primary text-white p-2 m-1">
        Responsive Box
      </div>

    </div>
  </div>

</body>
</html>
