<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Food Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h2>Pet Food Website</h2>

  <!-- 🐾 Pet Shop Card -->
  <div class="card" style="width: 30rem;">
    <!-- Image at top of card -->
    <img src="PetShop.jpeg" class="card-img-top" alt="Pet Shop">

    <!-- Card content -->
    <div class="card-body">
      <h5 class="card-title">PET FOOD SHOP</h5>
      <p class="card-text">
        Welcome to Paws & Tails Pet Shop! We offer food, toys, and accessories for all your pets. Visit us today!
      </p>
      <!-- Action button -->
      <a href="#" class="btn btn-primary">Click Here</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
